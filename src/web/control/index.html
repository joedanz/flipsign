<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>FlipSign Control</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header class="live card">
      <canvas id="live-board" class="board" aria-label="Current display"></canvas>
      <div class="status-row">
        <p id="status">Connecting…</p>
        <button id="clear" type="button" hidden>Clear</button>
      </div>
    </header>

    <section id="tab-message" class="panel card" data-panel="message" role="tabpanel" aria-labelledby="t-message">
      <textarea id="text" rows="3" maxlength="500" placeholder="Type a message…" aria-label="Message"></textarea>
      <canvas id="preview" class="board" aria-label="Preview"></canvas>
      <p id="warn" class="warn" hidden></p>
      <div id="colors" class="colors"></div>
      <div class="send-row">
        <select id="duration" aria-label="How long">
          <option value="15m">15 minutes</option>
          <option value="1h" selected>1 hour</option>
          <option value="4h">4 hours</option>
          <option value="forever">Until cleared</option>
          <option value="rotation">Add to rotation</option>
        </select>
        <button id="send" type="button" class="primary">Send</button>
      </div>
    </section>

    <section id="tab-rotation" class="panel card" data-panel="rotation" role="tabpanel" aria-labelledby="t-rotation" hidden>
      <ul id="rotation" class="list"></ul>
      <label class="field">Seconds per screen
        <input id="seconds" type="number" min="5" max="3600" inputmode="numeric">
      </label>
    </section>

    <section id="tab-quotes" class="panel card" data-panel="quotes" role="tabpanel" aria-labelledby="t-quotes" hidden>
      <p id="quote-count" class="muted"></p>
      <div class="inline">
        <input id="quote-search" type="search" placeholder="Search quotes…" aria-label="Search quotes">
        <button id="quotes-all" type="button">All</button>
        <button id="quotes-none" type="button">None</button>
      </div>
      <ul id="quotes" class="list quote-list"></ul>
      <details class="add-quote">
        <summary>Add a quote</summary>
        <textarea id="quote-text" rows="2" maxlength="300" placeholder="Add a quote…" aria-label="Quote text"></textarea>
        <input id="quote-author" maxlength="40" placeholder="Author (optional)" aria-label="Quote author">
        <button id="quote-add" type="button">Add quote</button>
      </details>
    </section>

    <section id="tab-settings" class="panel card" data-panel="settings" role="tabpanel" aria-labelledby="t-settings" hidden>
      <label class="field">Weather location
        <span class="inline"><input id="location" placeholder="City or ZIP"><button id="location-set" type="button">Set</button></span>
      </label>
      <p id="location-current" class="muted"></p>
      <div class="two-col">
        <label class="field">Temperature
          <select id="unit"><option value="F">°F</option><option value="C">°C</option></select>
        </label>
        <label class="field">Clock
          <select id="hour12"><option value="12">12-hour</option><option value="24">24-hour</option></select>
        </label>
      </div>
      <label class="check"><input id="sound" type="checkbox"> <span>Clacking sound</span></label>
      <label class="field">Flip time per flap: <output id="flip-out"></output>
        <input id="flip" type="range" min="30" max="300" step="10">
      </label>
    </section>
  </main>

  <nav id="tabs" role="tablist" aria-label="Sections">
    <button id="t-message" type="button" role="tab" data-tab="message" aria-selected="true"><span aria-hidden="true">✎</span>Message</button>
    <button id="t-rotation" type="button" role="tab" data-tab="rotation" aria-selected="false"><span aria-hidden="true">⟳</span>Rotation</button>
    <button id="t-quotes" type="button" role="tab" data-tab="quotes" aria-selected="false"><span aria-hidden="true">❝</span>Quotes</button>
    <button id="t-settings" type="button" role="tab" data-tab="settings" aria-selected="false"><span aria-hidden="true">⚙</span>Settings</button>
  </nav>
  <div id="toast" role="status"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
